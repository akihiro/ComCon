version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait a week after a release before proposing it, so a compromised release is likely caught and pulled first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  # Test-only packages (xunit, test SDK). ComCon.exe itself has no NuGet dependencies.
  - package-ecosystem: nuget
    directory: /tests/ComCon.Tests
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      test-packages:
        patterns: ['*']
    commit-message:
      prefix: test
